# =====================================================================
# shenyu-bootstrap 2.6.1 配置 overlay（springCloud 插件 + Nacos discovery）
# =====================================================================
# 目的：开启 stock 镜像 conf/application.yml 里默认关闭的 Nacos 服务发现，让
#      springCloud 插件通过 NacosDiscoveryClient 发现 shenyu-springcloud-demo 实例。
#
# 落地方式（推荐，不修改 gitee 仓库的 conf 文件）：
#   通过 docker-compose 环境变量注入（见 compose-patches/shenyu-261-bootstrap-attach-nacos-net.patch.yaml）。
#   Spring Boot relaxed binding 自动把 SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR 映射到
#   spring.cloud.nacos.discovery.server-addr。
#
# 本文件是「参考配置」，描述目标终态；下文 ⚙️ 行为标注每个 key 与 stock 镜像默认值的差异。
# =====================================================================

spring:
  cloud:
    discovery:
      enabled: true                  # ⚙️ stock 默认 false → 改 true（开启 Spring Cloud 服务发现总开关）
    nacos:
      discovery:
        # ⚙️ stock 默认 127.0.0.1:8848 → 改为容器名 nacosserver253:8848
        # 容器名只在 shenyu-bootstrap 接入 nacos_net_232 网络后才能解析
        # （见 compose-patches/shenyu-261-bootstrap-attach-nacos-net.patch.yaml 的 networks 改动）
        server-addr: nacosserver253:8848
        enabled: true                # ⚙️ stock 默认 false → 改 true（开启 Nacos 服务发现）
        # ⚙️ stock 默认 ShenyuRegisterCenter → 改为 ""（与 shenyu-springcloud-demo 的 namespace 一致 = public）
        # public namespace 的 ID 是空字符串（不是名字 "public"）
        namespace: ""
        # 鉴权已关闭（NACOS_AUTH_ENABLE=false），账号可留空；保留亦无害
        username: nacos
        password: nacos

shenyu:
  springCloudCache:
    # ⚙️ stock 默认 false，保持 false（官方 2.6.1 文档强制：用 Nacos/Eureka 时必须 false，
    # 每次心跳从注册中心现拉实例列表，不入 ShenYu 本地缓存，保证实例下线即时感知）
    enabled: false
