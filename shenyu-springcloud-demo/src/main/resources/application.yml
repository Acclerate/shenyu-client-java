# =====================================================================
# Spring Cloud + ShenYu springCloud plugin + Nacos 2.5.1 demo
# =====================================================================
# 两条独立通道并存：
#   通道① HTTP 元数据注册（shenyu.register）：把 @ShenyuRequestMapping 的 path 元数据推给 admin
#   通道③ Nacos 服务发现（spring.cloud.nacos.discovery）：本服务实例注册到 Nacos
#           shenyu-bootstrap 通过 NacosDiscoveryClient 拉取本服务实例，springCloud 插件据此转发
# serviceId（= spring.application.name）同时是：
#   - Nacos 上的服务名
#   - admin springCloud selector handle JSON 中的 "serviceId" 字段值
#   三者必须严格一致，否则 springCloud 插件拿不到实例。
# =====================================================================

server:
  port: 8470

spring:
  application:
    # 同时是 Nacos serviceId + admin selector handle.serviceId，不可改（除非三处同步）
    name: shenyu-springcloud-demo
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        # 宿主机访问容器映射端口（docker-compose 把容器 8848 映射到宿主 8848）
        server-addr: 127.0.0.1:8848
        # public namespace 的 ID 是空字符串（不是名字 "public"）；与 shenyu-bootstrap 侧必须一致
        namespace: ""
        # Nacos 2.5.x 即使 NACOS_AUTH_ENABLE=false，server 也会对未定义用户名返回 "User xxx not found"
        # （client 的 SecurityProxy 每次启动都尝试 login）。鉴权关闭时不传 username/password，
        # 让 client 走匿名（不调 login 接口），消除 ERROR 日志噪音。
        # username: nacos
        # password: nacos
        enabled: true

# === ShenYu client registration (HTTP 元数据 → admin) ===
shenyu:
  register:
    # 2.6.1 起唯一允许的注册类型；HTTP 推 admin
    registerType: http
    # 宿主机访问 admin 容器映射端口（docker-compose 把容器 9095 映射到宿主 9096）
    serverLists: http://localhost:9096
    props:
      username: admin
      # 与 admin 数据库 dashboard_user 表里的密码保持一致（本环境非默认 123456）
      password: 1qaz!QAZ
  client:
    springCloud:
      props:
        # 网关路径前缀；selector condition 与 rule condition 都以这个前缀起头
        # 例：contextPath=/springcloud-demo + 类级 /order + 方法 /findById
        #     => 网关路由路径 = /springcloud-demo/order/findById
        contextPath: /springcloud-demo
        # 是否把 contextPath 加到转发给后端的路径前缀：
        #   false => 后端真实路径 = /order/findById（推荐，后端不感知 contextPath）
        #   true  => 后端真实路径 = /springcloud-demo/order/findById
        addPrefixed: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # 把 ShenYu 客户端日志调到 DEBUG，便于观察元数据推送是否成功
    org.apache.shenyu: DEBUG
    # Nacos 客户端日志调到 INFO，便于观察 gRPC 注册心跳
    com.alibaba.nacos: INFO
    root: INFO
