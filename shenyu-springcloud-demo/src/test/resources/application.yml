# =====================================================================
# 测试环境 application.yml（src/test/resources，仅对单元测试生效）
# =====================================================================
# 目的：屏蔽主 application.yml 中的外部依赖，让单元测试（@WebMvcTest、POJO test 等）
#      在无 Nacos / 无 ShenYu admin 的环境也能跑通。
#
# 关键覆盖项：
#   1. 关闭 ShenYu 客户端注册（避免单测启动时尝试 HTTP 推 admin）
#   2. 关闭 Nacos 服务发现（避免单测启动时尝试 gRPC 连 Nacos）
#   3. 用随机端口（不与本地 dev 进程冲突）
#
# 注意：@WebMvcTest 默认不加载 @EnableDiscoveryClient 上下文，本文件主要是给
#      @SpringBootTest 类型的全栈测试用（如果未来需要补充）。
# =====================================================================

server:
  port: 0   # 随机端口，避免与本地 dev 进程 8470 冲突

spring:
  application:
    name: shenyu-springcloud-demo-test
  main:
    lazy-initialization: true   # 测试环境懒加载，加速启动
  cloud:
    discovery:
      enabled: false   # 测试不依赖 nacos
    nacos:
      discovery:
        enabled: false

# 显式关闭 ShenYu 客户端注册
shenyu:
  register:
    enabled: false
