# =====================================================================
# 公共配置（所有 profile 共享）
# =====================================================================
# 端口相关差异项在各自 profile 文件中定义：
#   - server.port
#   - shenyu.client.http.props.port
# 在 IDEA Run Configuration 的 "Active profiles" 填入 8179 或 8189 即可。
# =====================================================================

server:
  port: 8380   # 默认值，各 profile 可覆盖

spring:
  application:
    name: shenyu-http-demo
  main:
    allow-bean-definition-overriding: true

# === ShenYu client registration (HTTP) ===
shenyu:
  register:
    registerType: http
    serverLists: http://localhost:9096
    props:
      username: admin
      password: 1qaz!QAZ
  client:
    http:
      props:
        appName: http-demo
        contextPath: /http-demo11
        host: 10.19.236.150
        isFull: false

logging:
  level:
    org.apache.shenyu: INFO
    root: INFO
